name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Python syntax checks
      run: |
        python -m py_compile services/fusion-service/app.py
        python -m py_compile services/adapter_detection/adapter.py
        python -m py_compile services/adapter_anpr/adapter.py
        python -m py_compile services/adapter_anomaly/adapter.py
        python -m py_compile services/adapter_reid/adapter.py
        python -m py_compile services/adapter_face/adapter.py
        python -m py_compile shared/events.py
        python -m py_compile shared/adapter_base.py
        python -m py_compile scripts/local_mqtt_broker.py
    
    - name: Run tests
      run: |
        if [ -d "tests" ]; then
          python -m pytest tests/ -v || true
        fi

  dashboard:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
    
    - name: Install dashboard dependencies
      run: |
        cd dashboard
        npm install
    
    - name: TypeScript check
      run: |
        cd dashboard
        npx tsc --noEmit

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Validate docker-compose.yml
      run: |
        docker compose config > /dev/null